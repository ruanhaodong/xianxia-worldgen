<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>仙侠世界地图生成器 · Xianxia Worldgen</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>仙侠世界地图生成器</h1>
      <div class="sub">立方体球 LOD · 地面细节 · 可进入行走</div>

      <label for="seed">世界种子 Seed</label>
      <input id="seed" type="text" value="九州·42" />

      <button id="btn-generate">生成世界</button>
      <button id="btn-fly" class="secondary">切换飞行模式 (最高 1000 m/s)</button>
      <button id="btn-ground" class="secondary">进入地面 / 成为角色</button>
      <div id="mode-hint" class="mode-hint"></div>

      <div class="toggles">
        <label class="row"><input type="checkbox" id="ly-elev" checked /> 高程着色</label>
        <label class="row"><input type="checkbox" id="ly-biome" checked /> 生态/气候</label>
        <label class="row"><input type="checkbox" id="ly-rivers" checked /> 河流湖泊</label>
        <label class="row"><input type="checkbox" id="ly-settle" checked /> 聚落</label>
        <label class="row"><input type="checkbox" id="ly-roads" checked /> 道路</label>
        <label class="row"><input type="checkbox" id="ly-sects" checked /> 宗门</label>
      </div>

      <div class="stats" id="stats">尚未生成…</div>
      <p class="hint">
        <strong>轨道</strong>：拖拽旋转，滚轮/捏合缩放（太空→地面）。<br/>
        <strong>飞行</strong>：WASD，Shift 加速（≤1000 m/s），空格升，Ctrl 降，Q/E 调速。<br/>
        <strong>地面角色</strong>：WASD/方向键移动，鼠标拖拽视角，Shift 奔跑，空格跳跃；手机用左下摇杆 + 右侧拖拽视角。<br/>
        同一种子保证山河道路与地面细节一致。
      </p>
    </aside>
    <div id="main">
      <div id="map2d-wrap">
        <div class="badge">2D 等矩形概览（全球骨架）</div>
        <canvas id="map2d"></canvas>
      </div>
      <div id="globe-wrap">
        <div class="badge" id="globe-badge">3D 星球 LOD</div>
        <canvas id="globe"></canvas>
        <div id="touch-controls" aria-hidden="true">
          <div id="joy-base"><div id="joy-stick"></div></div>
          <div id="look-hint">拖拽右侧转向</div>
        </div>
      </div>
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "./js/vendor/three.module.js"
    }
  }
  </script>
  <script type="module" src="js/viewer/main.js"></script>
</body>
</html>
